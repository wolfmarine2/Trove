[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/wolfmarine2/Trove"
homepage = "https://github.com/wolfmarine2/Trove"
authors = ["Trove Contributors"]

[workspace.dependencies]
trove-core = { path = "crates/trove-core" }
trove-db = { path = "crates/trove-db" }
trove-storage = { path = "crates/trove-storage" }

anyhow = "1"
argon2 = "0.6"
async-stream = "0.3"
axum = { version = "0.8", features = ["multipart", "macros"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
lzma-rs = "0.3"
ruzstd = "0.9"
bzip2 = "0.6"
futures = "0.3"
hex = "0.4"
md-5 = "0.10"
mime_guess = "2"
object_store = { version = "0.14", default-features = false }
percent-encoding = "2"
quick-xml = { version = "0.42", features = ["serialize"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2", "socks"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate", "macros"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "fs", "cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
