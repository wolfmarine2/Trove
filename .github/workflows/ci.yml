name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trove
          POSTGRES_PASSWORD: trove
          POSTGRES_DB: trove_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trove" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          TROVE_TEST_POSTGRES_URL: postgres://trove:trove@localhost:5432/trove_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: trove:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name trove -p 8081:8081 -e TROVE__SECURITY__INITIAL_ADMIN_PASSWORD=ci-password-1 trove:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8081/healthz && break; sleep 1; done
          curl -fsS http://localhost:8081/api/v1/status
          curl -fsS http://localhost:8081/ | grep -q '<title>Trove</title>'
          docker exec trove trove healthcheck
          docker exec trove id -u | grep -qx 10001
          docker logs trove
