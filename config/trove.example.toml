# Trove configuration.
#
# Every key can be overridden with an environment variable named
# TROVE__<SECTION>__<KEY>, for example TROVE__DATABASE__URL=postgres://...
# Values shown are the defaults.

[server]
# Address and port to listen on.
bind = "0.0.0.0:8081"
# Public URL of this server, used in generated URLs (npm tarballs, Cargo
# config.json, PyPI links). Set it when Trove runs behind a reverse proxy or
# ingress. Empty: derived from the Host / X-Forwarded-* headers.
base_url = ""
# Public URL under which repositories are served when a reverse proxy maps
# them to another path, e.g. "https://mirrors.example.com" for
# "location / { proxy_pass http://trove:8081/repository/; }".
# Empty: <base_url>/repository.
repository_base_url = ""
# Largest accepted upload, in MiB.
max_upload_mb = 4096
# SQLite database, filesystem blobs and temporary files live here.
data_dir = "data"

[database]
# Empty: SQLite at <data_dir>/trove.db (single node).
# PostgreSQL / openGauss for multi-replica deployments:
#   url = "postgres://trove:secret@postgres:5432/trove"
url = ""
max_connections = 16

[storage]
# "filesystem" or "s3".
kind = "filesystem"
# Empty: <data_dir>/blobs
path = ""

[storage.s3]
# Any S3-compatible store: AWS S3, MinIO, Ceph RGW.
bucket = ""
endpoint = ""          # e.g. "http://minio.storage.svc:9000"
region = "us-east-1"
access_key_id = ""
secret_access_key = ""
prefix = ""            # optional key prefix inside the bucket
allow_http = false     # true for in-cluster MinIO over plain HTTP
path_style = true      # MinIO and Ceph usually need path-style addressing

[security]
# Password of the bootstrap "admin" user, used only on first start. Empty:
# a random password is written to <data_dir>/admin.password.
initial_admin_password = ""
# Anonymous read: anyone who can reach Trove may browse and download from
# every repository (the usual setup for an internal mirror). Publishing and
# administration always require a user. This is the initial value; it can be
# changed later under System in the UI.
anonymous_read = true
# Web UI session lifetime.
session_ttl_hours = 12

[http_client]
# Settings for requests to remote registries (proxy repositories).
# Seconds without receiving any data before a download is abandoned.
timeout_secs = 300
connect_timeout_secs = 15
# Default outbound proxy for proxy repositories: http://, https://, socks5://
# (local DNS) or socks5h:// (proxy resolves names), credentials allowed in the
# URL, e.g. "socks5h://user:pass@egress.internal:1080". Empty: HTTPS_PROXY /
# HTTP_PROXY / ALL_PROXY / NO_PROXY environment variables are honoured.
# Each proxy repository can override this (inherit / direct / custom).
proxy = ""
# Hosts that bypass `proxy`, comma separated.
no_proxy = ""
# Extra PEM CA bundle to trust, for TLS-inspecting egress proxies or remotes
# signed by an internal CA.
ca_bundle = ""

# TLS implementation for HTTPS remotes: "native" (system OpenSSL, the same
# handshake as curl/dnf; default) or "rustls". Some firewalls and load
# balancers reset rustls' short, unpadded ClientHello.
# tls_backend = "native"

[git]
# Git proxy repositories run this binary (the container image includes git).
binary = "git"
# Bare mirrors of upstream repositories. Empty: <data_dir>/git. Must be a
# local disk even when blobs are stored in S3.
mirror_dir = ""
# Upper bound for one clone or fetch from a remote, in seconds.
fetch_timeout_secs = 3600

[ui]
# Serve the web UI from this directory instead of the copy embedded in the
# binary. Useful during UI development: dir = "web/dist"
dir = ""

[log]
# tracing filter, e.g. "info,trove_server=debug". RUST_LOG takes precedence.
level = "info"
# JSON log lines for log collectors (Loki, Elasticsearch).
json = false
