apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trove
  annotations:
    # Large artifacts: disable request buffering and size limits at the edge.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  rules:
    - host: trove.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: trove, port: { name: http } }
  tls:
    - hosts: [trove.example.com]
      secretName: trove-tls
