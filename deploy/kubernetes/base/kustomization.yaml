apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: trove
      app.kubernetes.io/part-of: trove
    includeSelectors: true
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
images:
  - name: trove
    newName: trove
    newTag: latest
