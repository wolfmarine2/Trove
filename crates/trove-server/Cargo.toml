[package]
name = "trove-server"
description = "Trove: a self-hosted universal artifact repository manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "trove"

[[bin]]
name = "trove"
path = "src/main.rs"

[features]
default = []
# Embed the compiled web UI (web/dist) into the binary.
embed-ui = ["dep:rust-embed"]

[dependencies]
trove-core.workspace = true
trove-db.workspace = true
trove-storage.workspace = true
anyhow.workspace = true
argon2.workspace = true
async-stream.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
flate2.workspace = true
futures.workspace = true
hex.workspace = true
md-5.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
rust-embed = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
toml.workspace = true
sqlx.workspace = true
tar.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["multipart"] }
tempfile.workspace = true
